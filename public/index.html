<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="theme-color" content="#fcf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191712" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset, unchanged from Expo's
         own template: https://necolas.github.io/react-native-web/docs/setup/ -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- The paper, painted before any JavaScript runs. Generated from
         src/theme/tokens.ts — edit the tokens, then `npm run build:web-shell`. -->
    <style id="chronicle-shell">
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        background-color: #fcf9f4;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #191712;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to read The Chronicle.</noscript>
    <div id="root"></div>
  </body>
</html>
